services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}   # ← CRUCIAL
      - DISCORD_TOKEN=${DISCORD_TOKEN}           # ← CRUCIAL
    volumes:
      - n8n-data:/home/node/.n8n
      - /home/luffy/Github/Clothify/images/input:/files/input
      - /home/luffy/Github/Clothify/images/output:/files/output

volumes:
  n8n-data: